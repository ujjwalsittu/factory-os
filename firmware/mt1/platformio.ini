; MT-1 machine tap firmware (decision 064). `../scripts/check.sh` runs the host tests and the ESP32-S3 build.
[platformio]
default_envs = esp32s3-dev

[common]
fw_version = 1.0.0
lib_deps = bblanchon/ArduinoJson@7.4.2

[esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps = ${common.lib_deps}

; Development build: trusts only the public development key (firmware/scripts/sign.mjs --dev).
[env:esp32s3-dev]
extends = esp32s3
build_flags = -DFOS_DEV_BUILD -DFW_VERSION=\"${common.fw_version}-dev\"

; Release build: needs MT1_RELEASE_PUBKEY (base64) from the offline release key; see firmware/README.md.
[env:esp32s3-release]
extends = esp32s3
build_flags = -DFW_VERSION=\"${common.fw_version}\" -DFOS_OTA_PUBKEY=\"${sysenv.MT1_RELEASE_PUBKEY}\"

; Host tests of lib/tapcore (no hardware).
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
build_flags = -std=gnu++17 -Wall -Wextra

# Local development stack. `docker compose up -d db` for just Postgres,
# or `docker compose up --build` to run everything in containers.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factoryos
      POSTGRES_PASSWORD: factoryos
      POSTGRES_DB: factoryos
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryos"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: [full]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://factoryos:factoryos@db:5432/factoryos
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      WEB_ORIGIN: http://localhost:3000
      MIGRATE_ON_START: "true"
    ports: ["4000:4000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    profiles: [full]
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]

volumes:
  db:
